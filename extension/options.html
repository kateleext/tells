<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tells settings</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font: 15px/1.5 "Geist", system-ui, sans-serif; color: #15171A; background: #EEF0F3; margin: 0; padding: 40px 16px; }
  main { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 18px 40px -16px rgba(20,30,50,.25); display: grid; gap: 18px; }
  h1 { font-size: 28px; letter-spacing: -.04em; margin: 0; }
  h1 span { color: #E0513F; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 13px; }
  input { font: inherit; font-weight: 400; padding: 10px 12px; border: 1px solid #DDE1E6; border-radius: 10px; }
  .hint { color: #5A6069; font-size: 13px; font-weight: 400; }
  button { font: 600 14px/1 inherit; font-family: inherit; background: #15171A; color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer; justify-self: start; }
  #saved { color: #1F6B4A; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>tells<span>.</span></h1>
  <label>Anthropic API key
    <input id="anthropic" type="password" placeholder="sk-ant-..." autocomplete="off">
    <span class="hint">Writes the banner lines. Calls go straight to api.anthropic.com.</span>
  </label>
  <label>TypeSafe API key
    <input id="typesafe" type="password" placeholder="apikey_..." autocomplete="off">
    <span class="hint">Jev decides in ~200ms whether what trackers got is sensitive enough to show. Calls go straight to api.typesafe.ai.</span>
  </label>
  <span class="hint">Both keys stay in this browser.</span>
  <button id="save">Save</button>
  <span id="saved"></span>
</main>
<script src="dist/options.js"></script>
</body>
</html>
